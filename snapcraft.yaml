name: nvme-z
title: NVMe-Z
icon: snap/gui/icon.png
type: app
base: core24
version: "0.1.34"
website: https://www.nvme-z.tech
summary: NVMe-Z, Your NVMe’s Info & Upgrade Zen!
description: |
  NVMe-z is a user-friendly application for viewing detailed information about NVMe storage drives on your system.

  It provides an intuitive interface to display nvme ssd drive health, capabilities, and status, making it easy to monitor and recommends upgrade for best performance.

  Ideal for both enthusiasts and professionals, NVMe-z helps you keep track of your storage drives with clarity and ease.

  Snaps are confined, as such NVMe-Z may be unable to perform some of the tasks it typically does when unconfined. 
  This may result in the system log getting spammed with apparmor errors. 
  Granting access to the system-observe interface when in the snap will enable the features, and thus improve user experience.

grade: stable
confinement: strict

apps:
  nvme-z:
    command: usr/bin/nvme-z
    desktop: usr/share/applications/nvme-z.desktop
    extensions: [gnome]
    plugs:
      - hardware-observe
      - system-observe
      - single-instance-plug
    slots:
      - single-instance
    environment:
      GGML_OPENCL_PLATFORM: "0"
      GGML_OPENCL_DEVICE: "0"

slots:
  single-instance:
    interface: dbus
    bus: session
    name: org.app_nvmez_tech.SingleInstance

plugs:
  single-instance-plug:
    interface: dbus
    bus: session
    name: org.app_nvmez_tech.SingleInstance

parts:
  build-app:
    plugin: dump
    source: .
    build-snaps:
      - node/20/stable
    build-packages:
      - xvfb
      - libwebkit2gtk-4.1-dev
      - build-essential
      - curl
      - file
      - libxdo-dev
      - libssl-dev
      - libayatana-appindicator3-dev
      - librsvg2-dev
      - dpkg
      - python3 # Needed for node-gyp
      - gcc
      - pkg-config
      - libopenblas-dev
      - liblapack-dev
      - gfortran
      - libudev-dev
      - zlib1g-dev
      - libsystemd-dev
      - unzip
    stage-packages:
      - nvme-cli
      - libgtk-3-dev
      - libwebkit2gtk-4.1-0
      - libayatana-appindicator3-1
    override-build: |
      set -eu
      
      export DISPLAY=:99
      Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
      sleep 2
      
      # Install Rust
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      source "$HOME/.cargo/env"
      
      curl -L -o llama-b5930-bin-ubuntu-x64.zip https://github.com/ggml-org/llama.cpp/releases/download/b5930/llama-b5930-bin-ubuntu-x64.zip
      unzip llama-b5930-bin-ubuntu-x64.zip -d $SNAPCRAFT_PART_BUILD/llama-bin

      npm install -g @tauri-apps/cli@2.5.0

      npm install
      npm run tauri build -- --bundles deb

      dpkg -x src-tauri/target/release/bundle/deb/*.deb $SNAPCRAFT_PART_INSTALL/

      sed -i -e "s|Icon=nvme-z|Icon=/usr/share/icons/hicolor/256x256@2/apps/nvme-z.png|g" \
          "$SNAPCRAFT_PART_INSTALL/usr/share/applications/nvme-z.desktop"
